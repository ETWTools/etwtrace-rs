name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner image comes with rustup, so no toolchain action is needed; this brings stable up to date.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The static CRT lets the exe run without the Visual C++ redistributable.  The release profile keeps debug info,
      # so the build writes etwtrace.pdb next to etwtrace.exe.
      - name: Build release
        run: cargo build --release --locked
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - uses: actions/upload-artifact@v7
        with:
          name: etwtrace
          path: |
            target/release/etwtrace.exe
            target/release/etwtrace.pdb
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: etwtrace

      # Keep the original file names: the exe's debug directory names etwtrace.pdb, which is how debuggers find it.
      - name: Create release
        run: gh release create "$RELEASE_TAG" etwtrace.exe etwtrace.pdb --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && format('main-{0}', github.run_number) || github.ref_name }}
