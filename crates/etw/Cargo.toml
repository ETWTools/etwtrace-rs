[package]
name = "etw"
description = "The Win32 calls EtwTrace makes (ETW sessions, trace processing, relogging, tokens, volumes), behind safe functions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
windows-sys.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
